[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oran-deep-scheduler"
version = "0.1.0"
description = "Open reproduction and stress-testing framework for learning-based cellular radio schedulers."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]